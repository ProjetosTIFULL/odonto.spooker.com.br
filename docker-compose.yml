services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: odonto
      POSTGRES_PASSWORD: odonto
      POSTGRES_DB: odonto
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - odonto-db:/var/lib/postgresql/data
    networks:
      - default

  # Tambem entra na rede compartilhada do spooker-platform - fala com o
  # api-gateway do Orquestrador pra conectar/desconectar WhatsApp e
  # mandar mensagem manual do atendente.
  api:
    build: ./server
    restart: unless-stopped
    command: sh -c "npx prisma migrate deploy && npm run start"
    environment:
      DATABASE_URL: postgresql://odonto:odonto@db:5432/odonto?schema=public
      JWT_SECRET: ${JWT_SECRET:-troque-por-um-segredo-bem-longo-32-chars}
      PORT: 3333
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5180}
      GATEWAY_URL: http://api-gateway:8200
    ports:
      - '127.0.0.1:3333:3333'
    depends_on:
      - db
    networks:
      - default
      - spooker-net

  # Servidor MCP de odontologia - so este precisa falar com o Orquestrador
  # (spooker-platform), por isso tambem entra na rede compartilhada dele.
  mcp:
    build: ./server
    restart: unless-stopped
    command: npm run mcp:start
    environment:
      DATABASE_URL: postgresql://odonto:odonto@db:5432/odonto?schema=public
      JWT_SECRET: ${JWT_SECRET:-troque-por-um-segredo-bem-longo-32-chars}
      MCP_PORT: 3334
    ports:
      - '127.0.0.1:3334:3334'
    depends_on:
      - db
    networks:
      - default
      - spooker-net

  # Frontend (Vite) - mesma estrategia do orq-front: roda o proprio dev
  # server em "producao" (ja e feito assim pro resto do spooker-platform),
  # sem build/nginx estatico separado. O proxy /api do Vite fala com o
  # container "api" pelo nome dentro do docker-compose.
  front:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:3333
    ports:
      # So 127.0.0.1 - acessivel local (dev), nunca pelo IP publico da VPS.
      - '127.0.0.1:5180:5180'
    depends_on:
      - api
    networks:
      - default

networks:
  default:
  spooker-net:
    external: true
    name: ${DOCKER_NETWORK_NAME:-spooker-net}

volumes:
  odonto-db:
